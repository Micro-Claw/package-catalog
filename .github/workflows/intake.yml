name: Hostile head
on: pull_request_target
permissions:
  pull-requests: write
jobs:
  marker:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body 83F4_HEAD_WORKFLOW_EXECUTED
